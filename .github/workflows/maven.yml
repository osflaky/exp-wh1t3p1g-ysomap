# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
    # Zulu has no JDK 8 build for Windows on ARM, so windows-11-arm runs the
    # x64 JDK 8 under Windows 11's built-in x64 emulation.
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        architecture: ${{ (matrix.arch == 'arm64' && matrix.os != 
          'windows-latest') && 'aarch64' || 'x64' }}
    - name: Build with Maven
      run: mvn -B package -DskipTests --file pom.xml
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
